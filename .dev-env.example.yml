# Example Dev Environment Configuration
# Copy this file to .dev-env.yml and customize for your project

name: my-project
version: "1.0.0"

dependencies:
  - type: npm
    command: npm install
    path: .
  # - type: pip
  #   command: pip install -r requirements.txt
  #   path: ./backend

databases:
  - type: postgresql
    name: myapp_db
    version: "15"
    port: 5432
    user: ${DB_USER}  # Use environment variable
    password: ${DB_PASSWORD}  # Use environment variable
    database: myapp
    migrations:
      - path: ./migrations
        command: npm run migrate
    seed:
      command: npm run seed
      path: .  # optional: directory to run the seed command in (default ".")

  # - type: redis
  #   version: "7"
  #   port: 6379

services:
  # - type: rabbitmq
  #   version: "3.12"
  #   port: 5672
  #   management_port: 15672

# Environment variables (use .env file for secrets)
env:
  NODE_ENV: development
  # Use ${VAR_NAME} syntax to reference .env variables
  DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@localhost:5432/myapp
  # REDIS_URL: redis://localhost:6379

# Container healthchecks. Databases get a sensible default automatically; add an entry to tune
# interval/timeout/retries, or give any service a custom check with `test`:
# health_checks:
#   - name: rabbitmq_1        # the generated service name (or match by type)
#     type: rabbitmq
#     test: rabbitmq-diagnostics -q ping
#     interval: 30s
#     timeout: 10s
#     retries: 5

# Docker Compose generation
docker:
  enabled: true
  output_file: docker-compose.yml
  network_name: dev-network
